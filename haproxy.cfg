global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend cloudtask_front
    bind *:5000
    default_backend cloudtask_nodes

backend cloudtask_nodes
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server web1 web1:5000 check inter 3s fall 2 rise 2
    server web2 web2:5000 check inter 3s fall 2 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
