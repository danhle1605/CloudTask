<!-- app/templates/errors/403.html -->
{% extends "base.html" %}

{% block title %}403 - Không có quyền truy cập{% endblock %}

{% block content %}
<div class="card p-5 text-center mt-5 shadow-sm border-0" style="max-width: 560px; margin: 0 auto; border-radius: 16px;">
  <div class="display-1 text-danger fw-bold mb-3">403</div>
  <h2 class="h4 fw-bold mb-3 text-navy">Truy cập bị từ chối</h2>
  <p class="text-muted mb-4">Bạn không có quyền xem hoặc thao tác trên tài nguyên này. Tài nguyên có thể thuộc về một nhóm (workspace) khác.</p>
  <div>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4 py-2" style="background-color: var(--navy-primary); border: none;">Về Trang chủ</a>
  </div>
</div>
{% endblock %}
