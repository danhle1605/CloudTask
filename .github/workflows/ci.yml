name: CloudTask CI/CD Pipeline

on:
  push:
    branches: [ "connect-neon-postgres" ]
  pull_request:
    branches: ["main", "connect-neon-postgres"]
jobs:
  test:
    name: Build, Migrate & Test
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: task_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Database Migrations on Test DB
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          TEST_DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          SECRET_KEY: test-secret-key-32-chars-minimum-for-ci
          GROUP_INVITE_CODE: CLOUDTASK-GROUP-8
        run: |
          flask --app run.py db upgrade

      - name: Run Automated Tests with Pytest
        env:
          PYTHONPATH: .
          FLASK_ENV: testing
          DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          TEST_DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          SECRET_KEY: test-secret-key-32-chars-minimum-for-ci
          GROUP_INVITE_CODE: CLOUDTASK-GROUP-8
        run: |
          pytest -q

  deploy-render:
    name: Deploy to Render PaaS
    needs: test
    if: github.ref == 'refs/heads/connect-neon-postgres' && github.event_name == 'push'
    runs-on: ubuntu-22.04

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice ::RENDER_DEPLOY_HOOK_URL secret is not set yet. Skipping automatic PaaS deployment trigger. Code passed tests successfully."
          else
            echo "Triggering Render PaaS deployment..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered successfully!"
          fi
