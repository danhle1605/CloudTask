
name: CloudTask CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Build, Migrate and Test
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: "ĐTĐM"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: task_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user -d task_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "ĐTĐM/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check code with Ruff
        run: ruff check .

      - name: Run database migrations
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          TEST_DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          SECRET_KEY: test-secret-key-32-chars-minimum-for-ci
          GROUP_INVITE_CODE: CLOUDTASK-GROUP-8
        run: flask --app run.py db upgrade

      - name: Run automated tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          TEST_DATABASE_URL: postgresql+psycopg://task_user:task_password@localhost:5432/task_test_db
          SECRET_KEY: test-secret-key-32-chars-minimum-for-ci
          GROUP_INVITE_CODE: CLOUDTASK-GROUP-8
        run: pytest

  deploy-render:
    name: Deploy to Render PaaS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi

          curl --silent --show-error --fail \
            --request POST "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment request sent successfully."
